<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pante – DEX</title>
  <link rel="stylesheet" href="/html/css/style.css">
  <link rel="stylesheet" href="/html/css/dex-nft.css">
  <style>
    .header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem 1.5rem;
      background: rgba(0,0,0,0.3);
    }
    .header .logo-box {
      flex: 0 0 auto;
    }
    .header .wallet-btn,
    .header .lang-switch {
      flex: 0 0 auto;
    }
    .header-nav {
      display: flex;
      gap: 1.2rem;
      align-items: center;
    }
    .header-nav .nav-link {
      color: #f0f0ff;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      transition: all 0.2s;
    }
    .header-nav .nav-link:hover,
    .header-nav .nav-link.active {
      color: #ff9500;
      background: rgba(255,149,0,0.1);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-left: auto;
    }
    .wallet-btn {
      background: rgba(255,149,0,0.2);
      color: #ff9500;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .wallet-btn:hover {
      background: rgba(255,149,0,0.3);
      transform: translateY(-2px);
    }
    .menu-trigger {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
    }
    .menu-trigger .dot {
      width: 4px;
      height: 4px;
      background-color: #f0f0ff;
      border-radius: 50%;
      margin: 2px;
      display: block;
    }
  </style>
  <style>
    .header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0;
      margin: 0;
      justify-content: flex-start;
    }
    .header .logo-box {
      flex: 0 0 auto;
    }
    .header .wallet-btn,
    .header .lang-switch {
      flex: 0 0 auto;
    }
    .header a.nav-link {
      flex: 0 0 auto;
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      transition: color 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
      border: 1px solid rgba(255,149,0,0.4);
    }
    .header a.nav-link:hover {
      color: #ff9500;
      border-color: #ff9500;
      background: rgba(255,149,0,0.08);
    }
    .header a.nav-link.active {
      color: #ff9500;
      border-color: #ff9500;
      box-shadow: 0 2px 0 -1px #ff9500;
      background: rgba(255,149,0,0.12);
    }
    .header .menu-trigger {
      margin-left: auto;
    }
  </style>
</head>
<body>
  <!-- Header (same as index) -->
      <header class="bordered header">
    <!-- Menu Trigger (right-aligned) -->
    <button class="menu-trigger" id="menuTrigger" title="Menu">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </button>

    <!-- Navigation Links (center-aligned) -->
    <nav class="header-nav">
      <a href="index.html" class="nav-link active" data-i18n="nav.home">Home</a>
      <a href="dex.html" class="nav-link" data-i18n="nav.dex">DEX</a>
      <a href="nft.html" class="nav-link" data-i18n="nav.nft">NFT</a>
      <a href="about.html" class="nav-link" data-i18n="nav.about">About</a>
      <a href="whitepaper.html" class="nav-link" data-i18n="nav.whitepaper">Whitepaper</a>
    </nav>

    <!-- Language and Wallet (right-aligned) -->
    <div class="header-right">
      <div class="lang-switch">
        <select id="langSelect" aria-label="Select language">
          <option value="en">EN</option>
          <option value="zh">ZH</option>
          <option value="id">ID</option>
          <option value="vi">VI</option>
          <option value="hi">HI</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="de">DE</option>
          <option value="pt">PT</option>
          <option value="ru">RU</option>
          <option value="ja">JA</option>
          <option value="ko">KO</option>
          <option value="ar">AR</option>
          <option value="tl">TL</option>
        </select>
      </div>
      <button class="wallet-btn" id="walletBtn">Connect Wallet</button>
      <div class="logo-box">
        <a href="index.html"><img src="/html/assets/logo.png" alt="Pante Logo" class="logo-img"></a>
      </div>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="hero bordered reveal-block" id="hero">
    <img src="/html/assets/banner.png" alt="Hero Banner" class="hero-banner">
    <h1 class="typewriter" data-type="DEX Platform" data-speed="45"></h1>
    <p class="typewriter" data-type="Swap tokens & provide liquidity on our decentralized exchange." data-speed="22"></p>
  </section>

  <!-- Main Content -->
  <main>
    <section id="content">
      <h2 class="section-title typewriter" data-i18n="dex.title" data-type="Decentralized Exchange" data-speed="55"></h2>
      <p class="typewriter" data-i18n="dex.desc" data-type="Swap tokens on our DEX with low fees and high liquidity." data-speed="18"></p>

      <div class="dex-container">
        <!-- Price Chart -->
        <div class="chart-container">
          <!-- Chart placeholder -->
          <div id="price-chart"></div>
        </div>

        <!-- Token List -->
        <div class="token-list">
          <h3 class="typewriter" data-type="Available Tokens" data-speed="30">Available Tokens</h3>
          <ul class="token-pairs">
            <li class="pair">Token A / Token B</li>
            <li class="pair">Token C / Token D</li>
            <!-- Add more pairs as needed -->
          </ul>
        </div>

        <!-- Swap Interface -->
        <div class="swap-section">
          <h3 class="typewriter" data-type="Swap Tokens" data-speed="30">Swap Tokens</h3>
          <div class="swap-input">
            <input type="text" placeholder="Select Token" readonly>
          </div>
          <div class="swap-actions">
            <button id="swap-btn">Swap</button>
            <input type="number" placeholder="Amount" min="0.01">
          </div>
        </div>

        <!-- Liquidity Info -->
        <div class="liquidity-info">
          <h3 class="typewriter" data-type="Liquidity Mining" data-speed="30">Liquidity Mining</h3>
          <p>Earn rewards by providing liquidity to our pools. <span class="typewriter" data-type="APY">-- APY</span></p>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer (same as index) -->
  <footer class="bordered footer" id="footer">
    <div class="footer-social">
      <a href="https://x.com/pante_coin" target="_blank" rel="noopener" title="X (Twitter)" class="footer-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
      <a href="https://github.com/nheoshikuyanhemo/Pante" target="_blank" rel="noopener" title="GitHub" class="footer-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 .5C5.37.5 0 5.78 0 12.292c0 5.211 3.438 9.63 8.205 11.188.6.111.82-.254.82-.567 0-.28-.01-1.022-.015-2.005-3.338.711-4.042-1.582-4.042-1.582-.546-1.361-1.335-1.724-1.335-1.724-1.09-.731.083-.716.083-.716 1.205.082 1.838 1.215 1.838 1.215 1.07 1.797 2.809 1.278 3.495.977.108-.76.418-1.279.762-1.573-2.665-.297-5.466-1.296-5.466-5.759 0-1.273.462-2.313 1.22-3.129-.122-.296-.53-1.487.115-3.098 0 0 .995-.314 3.26 1.195a11.5 11.5 0 0 1 2.97-.395c1.007 0 2.023.132 2.97.395 2.262-1.509 3.256-1.195 3.256-1.195.646 1.611.24 2.802.118 3.098.759.816 1.22 1.856 1.22 3.129 0 4.476-2.805 5.459-5.476 5.749.429.364.812 1.084.812 2.186 0 1.578-.014 2.85-.014 3.238 0 .314.216.685.825.568C20.565 21.917 24 17.495 24 12.292 24 5.78 18.63.5 12 .5z"/></svg>
      </a>
    </div>
    <p data-i18n="footer">© 2026 Pante. All Rights Reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="/html/js/i18n.js"></script>
  <script src="/html/js/script.js"></script>
  <script type="module" src="/html/js/wallet-reown.js"></script>
  <script src="/html/js/dex-chart.js"></script>
  <script src="/html/js/dex-actions.js"></script>
</body>
</html>
