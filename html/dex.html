<!DOCTYPE html>

      <li><a href="/about"><span class="mc-title typewriter" data-i18n="menu.about" data-type="About" data-speed="30" data-delay="1100"></span><span class="mc-desc typewriter" data-i18n="menu.about.desc" data-type="Vision, utility & ecosystem links." data-speed="14" data-delay="1250"></span></a></li>

  <main>
    <!-- Hero Section -->
    <section class="hero bordered reveal-block" id="hero">

    <!-- Token Info Section -->
    <section class="vision bordered reveal-block" id="token-info">
      <div class="reveal-item">
        <h2 class="section-title typewriter" data-i18n="token.title" data-type="Token Information (PANTE)" data-speed="55"></h2>
        <p class="typewriter" data-i18n="token.contract" data-type="Contract: 0x42e73bD665FF561fAdE39F014411aB7234b16DB1" data-speed="18"></p>
        <p class="typewriter" data-i18n="token.name" data-type="Name: Pante Token" data-speed="18"></p>

        <p class="typewriter" data-i18n="token.decimals" data-type="Decimals: 18" data-speed="18"></p>
        <div style="margin-top:1rem;">
          <button id="refreshBalanceBtn" class="btn btn-primary">Check Balance</button>
          <span id="tokenBalance" style="margin-left:1rem;font-weight:600;">--</span>
        </div>
        <div style="margin-top:1rem;">
          <button id="transferBtn" class="btn btn-secondary">Transfer PANTE</button>

    <!-- DEX Interaction Section -->
    <section class="features bordered reveal-block" id="dex-section">
      <h2 class="section-title" data-i18n="dex.title">PanteSwap DEX Interaction</h2>
      <p style="margin-bottom:1rem;">DEX Contract: <strong>0x0568e0909055Bb4b9362EA8bc7397b844adAde60</strong></p>

      <div class="feature-grid">
        <!-- Add Liquidity -->
        <div class="feature-card reveal-item">
          <h3 class="typewriter" data-i18n="dex.addLiq" data-type="Add Liquidity" data-speed="40"></h3>
          <label>Token A (e.g., PANTE address): <input type="text" id="addTokenA" placeholder="0x..."></label><br>
          <label>Token B (e.g., stablecoin address): <input type="text" id="addTokenB" placeholder="0x..."></label><br>
          <label>Amount A: <input type="text" id="addAmtA" placeholder="Amount"></label><br>
          <label>Amount B: <input type="text" id="addAmtB" placeholder="Amount"></label><br>
          <label>Desired Liquidity (optional): <input type="text" id="desiredLiq" placeholder="LP tokens"></label><br>
          <button id="addLiqBtn" class="btn btn-primary">Add Liquidity</button>
          <div id="addLiqResult" style="margin-top:0.5rem;"></div>
        </div>

        <!-- Remove Liquidity -->
        <div class="feature-card reveal-item">
          <h3 class="typewriter" data-i18n="dex.removeLiq" data-type="Remove Liquidity" data-speed="40"></h3>
          <label>Liquidity Amount to remove: <input type="text" id="removeLiq" placeholder="LP tokens"></label><br>
          <label>Token A: <input type="text" id="rmTokenA" placeholder="0x..."></label><br>
          <label>Token B: <input type="text" id="rmTokenB" placeholder="0x..."></label><br>
          <button id="rmLiqBtn" class="btn btn-primary">Remove Liquidity</button>
          <div id="rmLiqResult" style="margin-top:0.5rem;"></div>
        </div>

        <!-- Swap Tokens -->
        <div class="feature-card reveal-item">
          <h3 class="typewriter" data-i18n="dex.swap" data-type="Swap Tokens" data-speed="40"></h3>
          <label>Swap From Token: <input type="text" id="swapFromToken" placeholder="0x..."></label><br>
          <label>Swap To Token: <input type="text" id="swapToToken" placeholder="0x..."></label><br>
          <label>Amount In: <input type="text" id="swapAmtIn" placeholder="Amount"></label><br>
          <label>Recipient Address: <input type="text" id="swapToAddr" placeholder="0x..."></label><br>
          <button id="swapBtn" class="btn btn-primary">Swap</button>
          <div id="swapResult" style="margin-top:0.5rem;"></div>
        </div>
      </div>
    </section>

    <!-- About Section -->
    <section class="ecosystem bordered reveal-block" id="about">
      <h2 class="section-title typewriter" data-i18n="about.title" data-type="About PanteSwap" data-speed="55"></h2>
      <p class="typewriter" data-i18n="about.text" data-type="PanteSwap is a decentralized exchange on the Arc Network, offering fast, low-cost token swaps and liquidity provision." data-speed="18"></p>
    </section>

    <!-- Roadmap Section -->

      <h2 class="section-title typewriter" data-i18n="roadmap.title" data-type="Roadmap" data-speed="55"></h2>
      <ul class="eco-list">
        <li class="typewriter" data-i18n="roadmap.1" data-type="✅ Token Deployment" data-speed="20"></li>
        <li class="typewriter" data-i18n="roadmap.2" data-type="✅ DEX Contract Deployment" data-speed="20"></li>
        <li class="typewriter" data-i18n="roadmap.3" data-type="🔄 Frontend Integration" data-speed="20"></li>
        <li class="typewriter" data-i18n="roadmap.4" data-type="⏳ Liquidity Mining" data-speed="20"></li>
        <li class="typewriter" data-i18n="roadmap.5" data-type="⏳ Governance DAO" data-speed="20"></li>
        <li class="typewriter" data-i18n="roadmap.6" data-type="⏳ Cross-chain Bridge" data-speed="20"></li>
      </ul>
    </section>

    <!-- Activity Log Section -->
    <section class="ecosystem bordered reveal-block" id="log-section">
      <h2 class="section-title typewriter" data-i18n="log.title" data-type="Activity Log" data-speed="55"></h2>
      <div id="log" class="log"></div>
    </section>

  <footer class="bordered footer" id="footer">
    <div class="footer-social">
      <a href="https://x.com/pante_coin" target="_blank" rel="noopener" title="X (Twitter)" class="footer-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

      <a href="https://github.com/nheoshikuyanhemo/Pante" target="_blank" rel="noopener" title="GitHub" class="footer-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 .5C5.37.5 0 5.78 0 12.292c0 5.211 3.438 9.63 8.205 11.188.6.111.82-.254.82-.567 0-.28-.01-1.022-.015-2.005-3.338.711-4.042-1.582-4.042-1.582-.546-1.361-1.335-1.724-1.335-1.724-1.09-.731.083-.716.083-.716 1.205.082 1.838 1.215 1.838 1.215 1.07 1.797 2.809 1.278 3.495.977.108-.76.418-1.279.762-1.573-2.665-.297-5.466-1.296-5.466-5.759 0-1.273.462-2.313 1.22-3.129-.122-.296-.53-1.487.115-3.098 0 0 .995-.314 3.26 1.195a11.5 11.5 0 0 1 2.97-.395c1.007 0 2.023.132 2.97.395 2.262-1.509 3.256-1.195 3.256-1.195.646 1.611.24 2.802.118 3.098.759.816 1.22 1.856 1.22 3.129 0 4.476-2.805 5.459-5.476 5.749.429.364.812 1.084.812 2.186 0 1.578-.014 2.85-.014 3.238 0 .314.216.685.825.568C20.565 21.917 24 17.495 24 12.292 24 5.78 18.63.5 12 .5z"/></svg>

  <script>
    // =============================================================
    // Helper: Logging
    // =============================================================
    const LOG = (msg) => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.textContent = msg;
      line.className = 'success';
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    };
    const ERR = (msg) => {
      const el = document.getElementById('log');
      const line = document.createElement('div');
      line.textContent = msg;
      line.className = 'error';
      el.appendChild(line);
      el.scrollTop = el.scrollHeight;
    };

    // =============================================================
    // State variables
    // =============================================================
    let provider, signer, tokenContract, swapContract;

    // =============================================================
    // DOM Elements
    // =============================================================
    const connectBtn = document.getElementById('walletBtn');
    const walletInfo = document.createElement('div');
    walletInfo.id = 'walletInfo';
    walletInfo.style.marginLeft = '1rem';
    walletInfo.style.fontSize = '0.9rem';
    walletInfo.style.color = '#a0a0b8';
    document.querySelector('.header-right').appendChild(walletInfo);

    // =============================================================
    // Connect Wallet
    // =============================================================
    connectBtn.onclick = async () => {
      if (!window.ethereum) {
        ERR('MetaMask not detected');
        return;
      }
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send('eth_requestAccounts', []);
      signer = provider.getSigner();
      const addr = await signer.getAddress();
      walletInfo.textContent = `Connected: ${addr}`;
      LOG(`Connected to ${addr}`);

      // Initialize contracts AFTER signer is available
      initContracts();
      detectNetwork();

      connectBtn.textContent = 'Connected';
      connectBtn.classList.add('connected');
    };

    // =============================================================
    // Contract ABIs & Addresses
    // =============================================================
    const tokenAddress = "0x42e73bD665FF561fAdE39F014411aB7234b16DB1";
    const tokenAbi = [
      "function name() view returns (string)",
      "function symbol() view returns (string)",
      "function decimals() view returns (uint8)",
      "function totalSupply() view returns (uint256)",
      "function balanceOf(address) view returns (uint256)",
      "function transfer(address,uint256) returns (bool)",
      "function allowance(address,address) view returns (uint256)",
      "function approve(address,uint256) returns (bool)",
      "function transferFrom(address,address,uint256) returns (bool)"
    ];

    const swapAbi = [
      "function swapExactTokensForTokens(address tokenIn, address tokenOut, uint256 amountIn, address to) external returns (uint256 amountOut)",
      "function addLiquidity(address tokenA, address tokenB, uint256 amountA, uint256 amountB, uint128 liquidityDesired) external",
      "function removeLiquidity(address tokenA, address tokenB, uint128 liquidity) external",
      "function setFeeBP(uint256 newFeeBP) external",
      "event Swapped(address indexed pair, address indexed sender, uint256 amountIn, uint256 amountOut)"
    ];

    function initContracts() {
      tokenContract = new ethers.Contract(tokenAddress, tokenAbi, signer);
      swapContract = new ethers.Contract(
        "0x0568e0909055Bb4b9362EA8bc7397b844adAde60",
        swapAbi,
        signer
      );
      LOG('✅ Contracts loaded');
    }

    // =============================================================
    // Helper: Parse amounts with 18 decimals
    // =============================================================
    const toWei = (raw) => ethers.utils.parseUnits(raw, 18);
    const fromWei = (wei) => ethers.utils.formatUnits(wei, 18);

    // =============================================================
    // Balance Check
    // =============================================================
    document.getElementById('refreshBalanceBtn').onclick = async () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      if (!tokenContract) { ERR('Contracts not initialized'); return; }
      const bal = await tokenContract.balanceOf(await signer.getAddress());
      document.getElementById('tokenBalance').textContent = bal.toString() + " PANTE";
      LOG(`Balance: ${bal.toString()} PANTE`);
    };

    // =============================================================
    // Transfer PANTE
    // =============================================================
    document.getElementById('transferBtn').onclick = () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      document.getElementById('transferForm').style.display = 'block';
    };
    document.getElementById('doTransfer').onclick = async () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      const to = document.getElementById('toAddress').value;
      const amt = document.getElementById('amount').value;
      if (!to || !amt) { ERR('Please fill both address and amount'); return; }
      try {
        const tx = await tokenContract.transfer(to, ethers.utils.parseUnits(amt, 18));
        LOG(`Transfer tx: ${tx.hash}`);
        await tx.wait();
        LOG('Transfer completed');
        document.getElementById('transferForm').style.display = 'none';
      } catch (e) { ERR('Transfer failed: ' + e.message); }
    };

    // =============================================================
    // Add Liquidity
    // =============================================================
    document.getElementById('addLiqBtn').onclick = async () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      if (!swapContract) { ERR('Contracts not initialized'); return; }
      const tokenA = document.getElementById('addTokenA').value;
      const tokenB = document.getElementById('addTokenB').value;
      const amtA = document.getElementById('addAmtA').value;
      const amtB = document.getElementById('addAmtB').value;
      const desired = document.getElementById('desiredLiq').value;
      if (!tokenA || !tokenB || !amtA || !amtB) {
        ERR('All token and amount fields are required');
        return;
      }
      try {
        const tx = await swapContract.addLiquidity(
          tokenA,
          tokenB,
          toWei(amtA),
          toWei(amtB),
          desired ? toWei(desired) : 0
        );
        LOG(`Add liquidity tx: ${tx.hash}`);
        await tx.wait();
        LOG('Liquidity added');
        document.getElementById('addLiqResult').textContent = 'Successfully added liquidity';
      } catch (e) { ERR('Failed to add liquidity: ' + e.message); }
    };

    // =============================================================
    // Remove Liquidity
    // =============================================================
    document.getElementById('rmLiqBtn').onclick = async () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      if (!swapContract) { ERR('Contracts not initialized'); return; }
      const tokenA = document.getElementById('rmTokenA').value;
      const tokenB = document.getElementById('rmTokenB').value;
      const liq = document.getElementById('removeLiq').value;
      if (!tokenA || !tokenB || !liq) {
        ERR('Please fill all fields');
        return;
      }
      try {
        const tx = await swapContract.removeLiquidity(
          tokenA,
          tokenB,
          toWei(liq)
        );
        LOG(`Remove liquidity tx: ${tx.hash}`);
        await tx.wait();
        LOG('Liquidity removed');
        document.getElementById('rmLiqResult').textContent = 'Successfully removed liquidity';
      } catch (e) { ERR('Failed to remove liquidity: ' + e.message); }
    };

    // =============================================================
    // Swap Tokens
    // =============================================================
    document.getElementById('swapBtn').onclick = async () => {
      if (!signer) { ERR('Connect wallet first'); return; }
      if (!swapContract) { ERR('Contracts not initialized'); return; }
      const tokenIn = document.getElementById('swapFromToken').value;
      const tokenOut = document.getElementById('swapToToken').value;
      const amountIn = document.getElementById('swapAmtIn').value;
      const to = document.getElementById('swapToAddr').value;
      if (!tokenIn || !tokenOut || !amountIn || !to) {
        ERR('All fields are required');
        return;
      }
      try {
        const tx = await swapContract.swapExactTokensForTokens(
          tokenIn,
          tokenOut,
          toWei(amountIn),
          to
        );
        LOG(`Swap tx: ${tx.hash}`);
        await tx.wait();
        LOG('Swap completed');
        document.getElementById('swapResult').textContent = 'Swap successful';
      } catch (e) { ERR('Swap failed: ' + e.message); }
    };

    // =============================================================
    // Auto-detect network (optional sanity check)
    // =============================================================
    async function detectNetwork() {
      if (!signer) return;
      const chainId = await provider.getNetwork().then(n => n.chainId);
      const netName = (chainId === 1) ? 'Ethereum Mainnet' :
                      (chainId === 11155111) ? 'Sepolia Testnet' :
                      (chainId === 28893) ? 'Arc Testnet' : 'Unknown';
      LOG(`Network detected: ${netName}`);
      // Uncomment to force Arc Testnet only:
      // if (chainId !== 28893) ERR('Please switch to Arc Testnet');
    }

    // =============================================================
    // Menu & Wallet Modal UI
    // =============================================================
    const menuTrigger = document.getElementById('menuTrigger');
    const menuBackdrop = document.getElementById('menuBackdrop');
    const menuPanel = document.getElementById('menuPanel');
    const menuClose = document.getElementById('menuClose');
    const walletModal = document.getElementById('walletModal');
    const walletModalClose = document.getElementById('walletModalClose');

    // Open menu
    menuTrigger.addEventListener('click', () => {
      menuBackdrop.style.opacity = '1';
      menuBackdrop.style.visibility = 'visible';
      menuPanel.classList.add('open');
    });
    // Close menu via backdrop or close button
    menuBackdrop.addEventListener('click', () => {
      menuBackdrop.style.opacity = '0';
      menuBackdrop.style.visibility = 'hidden';
      menuPanel.classList.remove('open');
    });
    menuClose.addEventListener('click', () => {
      menuBackdrop.style.opacity = '0';
      menuBackdrop.style.visibility = 'hidden';
      menuPanel.classList.remove('open');
    });

    // Wallet modal
    walletBtn.addEventListener('click', () => walletModal.style.display = 'flex');
    walletModalClose.addEventListener('click', () => walletModal.style.display = 'none');
    window.addEventListener('click', (e) => {
      if (e.target === walletModal) walletModal.style.display = 'none';
    });

    // Language selector (placeholder)
    const langSelect = document.getElementById('langSelect');
    const handleLangChange = (e) => LOG(`Language changed to: ${e.target.value}`);
    langSelect.addEventListener('change', handleLangChange);

    // Smooth scroll for header nav links
    document.querySelectorAll('.header-nav .nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('href');
        if (targetId === '/' || targetId === '/index.html') return; // let normal navigation happen
        const target = document.querySelector(targetId);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
          document.querySelectorAll('.header-nav .nav-link').forEach(l => l.classList.remove('active'));
          link.classList.add('active');
        }
      });
    });

    // Smooth scroll for mobile menu links
    document.querySelectorAll('.menu-contents a').forEach(link => {
      link.addEventListener('click', (e) => {
        const href = link.getAttribute('href');
        if (href.startsWith('http') || href === '/' || href === '/index.html') return; // external or home
        e.preventDefault();
        const target = document.querySelector(href);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
          // Close mobile menu
          menuBackdrop.style.opacity = '0';
          menuBackdrop.style.visibility = 'hidden';
          menuPanel.classList.remove('open');
        }
      });
    });

    // =============================================================
    // Scroll Reveal Animation
    // =============================================================
    const revealElements = document.querySelectorAll('.reveal-block');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          const items = Array.from(entry.target.querySelectorAll('.reveal-item'));
          items.forEach((item, idx) => {
            setTimeout(() => item.classList.add('visible'), 100 * idx);
          });
        }
      });
    }, { threshold: 0.1 });
    revealElements.forEach(el => observer.observe(el));

    // =============================================================
    // Typewriter effect
    // =============================================================
    document.querySelectorAll('.typewriter[data-type]').forEach(el => {
      const text = el.getAttribute('data-type');
      el.textContent = '';
      let i = 0;
      const type = () => {
        if (i < text.length) {
          el.textContent += text.charAt(i);
          i++;
          setTimeout(type, el.getAttribute('data-speed') || 100);
        }
      };
      setTimeout(type, el.getAttribute('data-delay') || 0);
    });
  </script>
</body>
</html>
