      <span class="dot"></span><span class="dot"></span><span class="dot"></span>

    <a href="dex.html" class="nav-link" data-i18n="nav.dex">DEX</a>
  </nav>

    <ul class="menu-contents">

      <li><a href="dex.html"><span class="mc-title typewriter" data-i18n="menu.dex" data-type="DEX" data-speed="30" data-delay="1100"></span><span class="mc-desc typewriter" data-i18n="menu.dex.desc" data-type="Swap tokens on our decentralized exchange" data-speed="14" data-delay="1500"></span></a></li>
      <li><a href="https://x.com/pante_coin" target="_blank"><span class="mc-title typewriter" data-i18n="menu.x" data-type="X (Twitter)" data-speed="30" data-delay="1100"></span><span class="mc-desc typewriter" data-i18n="menu.x.desc" data-type="Official announcements & community." data-speed="14" data-delay="1250"></span></a></li>
      <li><a href="https://github.com/nheoshikuyanhemo/Pante" target="_blank"><span class="mc-title typewriter" data-i18n="menu.github" data-type="GitHub" data-speed="30" data-delay="1400"></span><span class="mc-desc typewriter" data-i18n="menu.github.desc" data-type="Source code & development repository." data-speed="14" data-delay="1550"></span></a></li>
    </ul>
  </aside>

  <!-- DEX Main -->
  <main>
    <section class="dex-wrap bordered reveal-block" id="dex">
      <h1 class="typewriter" data-i18n="dex.title" data-type="Pante DEX" data-speed="50"></h1>
      <p class="typewriter" data-i18n="dex.tagline" data-type="Decentralized trading with real-time charting and liquidity tools." data-speed="25"></p>
      
      <div class="dex-grid">
        <!-- Chart Panel -->
        <div class="dex-chart-panel">
          <div class="trading-header">
            <span class="pair-label">PANTE/USDC</span>
            <span class="pair-price" id="pair-price">$0.000000</span>
          </div>
          <div class="tradingview-widget-container">
            <div class="tradingview-widget-container__widget" id="tradingview-chart"></div>
            <div class="tradingview-widget-copyright"><a href="https://www.tradingview.com/" rel="noopener nofollow" target="_blank"><span class="blue-text">Track all markets on TradingView</span></a></div>
          </div>
        </div>

        <!-- Swap Panel -->
        <div class="dex-swap-panel">
          <div class="swap-header">
            <span data-i18n="dex.swap">Swap</span>
          </div>
          <div class="swap-body">
            <div class="swap-input">
              <label data-i18n="dex.from">From</label>
              <input type="text" id="from-amount" placeholder="0.0" />
              <select id="from-token">
                <option value="PANTE">PANTE</option>
                <option value="USDC">USDC</option>
                <option value="ETH">ETH</option>
              </select>
            </div>
            <button class="swap-switch" id="swap-switch">↓</button>
            <div class="swap-input">
              <label data-i18n="dex.to">To</label>
              <input type="text" id="to-amount" placeholder="0.0" readonly />
              <select id="to-token">
                <option value="USDC">USDC</option>
                <option value="PANTE">PANTE</option>
                <option value="ETH">ETH</option>
              </select>
            </div>
            <button class="dex-action-btn" id="swap-btn" data-i18n="dex.swap">Swap</button>
          </div>
        </div>
      </div>

      <!-- Liquidity / Stake Tabs -->
      <div class="dex-tabs">
        <button class="tab-btn active" data-tab="liquidity" data-i18n="dex.liquidity">Liquidity</button>
        <button class="tab-btn" data-tab="stake" data-i18n="dex.stake">Stake</button>
        <button class="tab-btn" data-tab="bridge" data-i18n="dex.bridge">Bridge</button>
      </div>

      <div class="dex-tab-content" id="liquidity-tab">
        <h3 data-i18n="dex.add_liquidity">Add Liquidity</h3>
        <div class="lp-inputs">
          <div class="swap-input">
            <label>PANTE</label>
            <input type="text" id="lp-pante" placeholder="0.0" />
          </div>
          <div class="swap-input">
            <label>USDC</label>
            <input type="text" id="lp-usdc" placeholder="0.0" />
          </div>
        </div>
        <button class="dex-action-btn" id="lp-btn" data-i18n="dex.add_liquidity">Add Liquidity</button>
      </div>

      <div class="dex-tab-content hidden" id="stake-tab">
        <h3 data-i18n="dex.staking">Staking</h3>
        <div class="stake-info">
          <div class="stake-apy">APY: <span id="stake-apy">0%</span></div>
          <div class="stake-tvl">TVL: <span id="stake-tvl">$0</span></div>
        </div>
        <div class="swap-input">
          <label data-i18n="dex.amount">Amount</label>
          <input type="text" id="stake-amount" placeholder="0.0 PANTE" />
        </div>
        <button class="dex-action-btn" id="stake-btn" data-i18n="dex.stake">Stake</button>
      </div>

      <div class="dex-tab-content hidden" id="bridge-tab">
        <h3 data-i18n="dex.bridge_title">Cross-chain Bridge</h3>
        <p data-i18n="dex.bridge_desc">Transfer PANTE across Ethereum, Polygon, BNB Chain and more.</p>
        <div class="bridge-form">
          <select id="bridge-from">
            <option value="ethereum">Ethereum</option>
            <option value="polygon">Polygon</option>
            <option value="bsc">BNB Chain</option>
          </select>
          <span>→</span>
          <select id="bridge-to">
            <option value="polygon">Polygon</option>
            <option value="bsc">BNB Chain</option>
            <option value="ethereum">Ethereum</option>
          </select>
        </div>
        <button class="dex-action-btn" id="bridge-btn" data-i18n="dex.bridge">Bridge</button>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bordered footer" id="footer">
