<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="50%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow1)"/>
  <rect width="1200" height="400" fill="url(#glow2)"/>
  <!-- Grid lines -->
  <g stroke="#ff9500" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="80"  x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="720" y1="0" x2="720" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
  </g>
  <!-- Orange top line -->
  <rect x="0" y="0" width="1200" height="3" fill="#ff9500" opacity="0.9"/>
  <!-- Logo circle -->
  <circle cx="180" cy="200" r="110" fill="#14141f" stroke="#ff9500" stroke-width="2" opacity="0.9"/>
  <circle cx="180" cy="200" r="110" fill="none" stroke="#ff9500" stroke-width="2"/>
  <text x="180" y="235" font-family="Courier New, monospace" font-size="110" font-weight="900"
        fill="#ff9500" text-anchor="middle">P</text>
  <!-- Main title -->
  <text x="640" y="175" font-family="Courier New, monospace" font-size="72" font-weight="900"
        fill="#ff9500" text-anchor="middle" letter-spacing="8">PANTE</text>
  <!-- Subtitle -->
  <text x="640" y="230" font-family="Courier New, monospace" font-size="22" font-weight="400"
        fill="#f0f0ff" text-anchor="middle" opacity="0.85" letter-spacing="2">Meme with Utility &amp; Sustainable Development</text>
  <!-- Tag line -->
  <text x="640" y="285" font-family="Courier New, monospace" font-size="15" font-weight="400"
        fill="#a0a0b8" text-anchor="middle" letter-spacing="4">POWERED BY ARC TESTNET · USDC GAS · SUB-SECOND FINALITY</text>
  <!-- Bottom line -->
  <rect x="0" y="397" width="1200" height="3" fill="#ff9500" opacity="0.4"/>
</svg>
